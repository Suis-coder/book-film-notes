<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{作品中文名}}｜看完再說</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<!-- 使用方式：複製到 notes/books/ 或 notes/films/，檔名 = slug.html。
     作品資料區由 site.js 依 data-slug 自動產生，不要在這裡手寫。
     替換完所有 {{ }} 後，刪掉這段註解。詳見 AGENTS.md §6 -->
<body data-slug="{{slug}}">
  <div class="wrap-narrow">
    <a class="back" href="../../index.html">← 回目錄</a>
    <header class="note-head" id="note-head"></header>

    <article class="note">
      <section id="one-liner">
        <h2>一句話心得</h2>
        <blockquote>{{一句話心得，30 字以內，與 notes.js 的 oneLiner 相同}}</blockquote>
      </section>

      <section id="summary">
        <h2>內容摘要（無雷）</h2>
        <p>{{1–2 段，150–250 字。只講前提和設定，不講結局與關鍵轉折。}}</p>
      </section>

      <section id="thoughts">
        <h2>我的想法</h2>
        <p>{{2–4 段。喜歡什麼、不喜歡什麼、為什麼，要有具體例子。}}</p>
        <!-- 選用：要談結局才加，否則整段刪掉
        <details class="spoiler">
          <summary>有雷區：點開才看</summary>
          <p>{{談結局或關鍵轉折}}</p>
        </details>
        -->
      </section>

      <section id="recommend">
        <h2>推薦給誰</h2>
        <ul>
          <li>{{推薦對象 1}}</li>
          <li>{{推薦對象 2}}</li>
          <li>不推薦給：{{不適合的人}}</li>
        </ul>
      </section>
    </article>

    <footer class="site-footer">看完再說・筆記內容為個人心得</footer>
  </div>

  <script src="../../data/notes.js"></script>
  <script src="../../assets/site.js"></script>
</body>
</html>
